<title>1 Enoc 101 — El mar y el temor de los navegantes</title>
<desc>Grabado vectorial sepia sobre pergamino: un barco antiguo zarandeado por olas y viento, Enoc observa desde una roca, la arena delimita el mar y las nubes anuncian lluvia retenida.</desc>
<defs>
