  <linearGradient id="sail" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1e1bf"/><stop offset="1" stop-color="#c8a477"/></linearGradient>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0M-2 2L2-2M6 10L10 6" stroke="#76502f" stroke-width=".7" opacity=".48"/></pattern>
  <pattern id="waves" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 7q6-6 12 0t12 0" fill="none" stroke="#5d4028" stroke-width="1" opacity=".55"/></pattern>
</defs>
