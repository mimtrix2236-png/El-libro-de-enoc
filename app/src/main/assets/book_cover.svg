<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-label="Cubierta rústica de cuero marrón para El Libro de Enoc, edición ilustrada de Mauro Iván Maidana">
<title>El Libro de Enoc — cubierta de cuero marrón</title>
<defs>
  <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#24130e"/>
    <stop offset=".28" stop-color="#59301c"/>
    <stop offset=".58" stop-color="#3b2015"/>
    <stop offset=".82" stop-color="#69402a"/>
    <stop offset="1" stop-color="#29170f"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0d89a"/>
    <stop offset=".45" stop-color="#b9853f"/>
    <stop offset="1" stop-color="#e4c17c"/>
  </linearGradient>
  <radialGradient id="wear">
    <stop offset="0" stop-color="#9a6a3c" stop-opacity=".22"/>
    <stop offset="1" stop-color="#120a07" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grain" width="23" height="23" patternUnits="userSpaceOnUse">
    <path d="M2 5l5-2M13 8l4 1M4 18l7-2M17 21l3-3" stroke="#d1a06a" stroke-width=".7" opacity=".12" fill="none"/>
    <circle cx="9" cy="12" r=".8" fill="#160d09" opacity=".28"/>
    <circle cx="20" cy="4" r=".6" fill="#e1b77a" opacity=".16"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2"/>
  </filter>
</defs>
<rect width="600" height="900" rx="15" fill="#170d09"/>
<rect x="9" y="9" width="582" height="882" rx="13" fill="url(#leather)" stroke="#1a0e09" stroke-width="7"/>
