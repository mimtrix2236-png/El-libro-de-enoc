<ellipse cx="90" cy="110" rx="180" ry="210" fill="url(#wear)"/>
<ellipse cx="540" cy="760" rx="190" ry="230" fill="url(#wear)"/>
<rect x="27" y="27" width="546" height="846" rx="8" fill="none" stroke="#1b100b" stroke-width="9" opacity=".8"/>
<rect x="38" y="38" width="524" height="824" rx="5" fill="none" stroke="url(#gold)" stroke-width="3"/>
<rect x="49" y="49" width="502" height="802" rx="3" fill="none" stroke="#8c6236" stroke-width="1.3"/>
