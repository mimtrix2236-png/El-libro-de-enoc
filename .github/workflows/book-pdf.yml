name: Book PDF editorial proof

on:
  push:
    paths:
      - "docs/chapters/**"
      - "docs/00_front_matter.md"
      - "docs/glosario_preliminar.md"
      - "docs/bibliografia_fuentes_cotejo.md"
      - "assets/book_cover.svg"
      - "scripts/build_book_pdf.py"
      - "requirements-pdf.txt"
      - ".github/workflows/book-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pdf.txt
      - name: Build and verify editorial proof PDF
        run: python scripts/build_book_pdf.py --output dist/El_Libro_de_Enoc_prueba_editorial.pdf
      - name: Upload editorial proof PDF
        uses: actions/upload-artifact@v4
        with:
          name: el-libro-de-enoc-pdf-prueba-editorial
          path: dist/El_Libro_de_Enoc_prueba_editorial.pdf
          if-no-files-found: error
          retention-days: 30
